name: "build linux"

# Builds the Linux bundles (deb, rpm, AppImage) of the branch it runs on and
# keeps them as workflow artifacts: no release, no tag. Same steps as the
# Linux leg of publish.yml.
on:
  push:
    branches:
      - d200x
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      DENO_DIR: deno_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.DENO_DIR }}
          key: ${{ hashFiles('deno.lock') }}

      - name: install frontend dependencies
        run: deno install

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev xdg-utils libdbus-1-dev

      - name: build
        run: deno task tauri build

      - name: upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: opendeck-linux-x86_64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
